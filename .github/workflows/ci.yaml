name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Build and validate
        run: ./build/build.sh
